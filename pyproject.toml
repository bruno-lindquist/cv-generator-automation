[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-generator-automation"
version = "0.1.0"
description = "Generate multilingual CV PDFs from JSON input."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "loguru==0.7.2",
  "reportlab==4.0.9",
]

[project.optional-dependencies]
dev = [
  "ruff==0.6.9",
  "mypy==1.13.0",
  "pip-audit==2.7.3",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[project.scripts]
cv-generator = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "cli",
  "cv_service",
  "exceptions",
  "localization",
  "logging_config",
  "path_resolver",
  "validators",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "__pycache__", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
